# The Rust CLI's CI.
#
# This repo is crate-only: there is no extension beside it yet, so the `parity`
# and `differential` jobs the two-frontend siblings run have nothing to compare
# and are deliberately absent rather than present and vacuous. They arrive with
# the extension.
name: CI (crate)

on:
  # Manually runnable as well as push-triggered. Push events are not
  # guaranteed: during a GitHub Actions incident they are throttled and
  # silently dropped, and a dropped event never replays — leaving a commit with
  # no way to be verified. Dispatch is the escape hatch.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crate/**'
      - '.github/workflows/ci-crate.yml'
  pull_request:
    paths:
      - 'crate/**'
      - '.github/workflows/ci-crate.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: crate

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - name: Verify the declared rust-version actually builds
        run: cargo check --locked

  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Forbid inline lint suppressions
        working-directory: .
        run: |
          if grep -rn '#\[allow(' crate/src --include='*.rs'; then
            echo 'Inline #[allow] found — fix the lint or relax it in [lints.clippy] in crate/Cargo.toml.'
            exit 1
          fi
      # The two frontends share one MCP tool and nothing else. A doc that
      # says the crate must reproduce the extension's output re-imposes
      # the constraint the surfaces were deliberately freed from — and it
      # spreads, because the next SPEC.md gets written from a sibling.
      - name: Forbid a doc holding the two surfaces equal
        working-directory: .
        run: |
          hits=$(grep -rniE \
            'difference is a regression|reproduces its output exactly|is the reference implementation for' \
            --include='*.md' . 2>/dev/null | grep -vE '/target/|CHANGELOG\.md' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo
            echo 'Only the shared MCP tool is held equal. The surfaces are IDE-first'
            echo 'and terminal-first and are meant to differ — say which one you mean.'
            exit 1
          fi

  # AGENTS.md sets a 90% line coverage floor per module for detect/.
  # Enforced per module, not on the total: a total hides one module sliding
  # while the others carry it. Scoped to detect/ because everything else
  # is I/O verified by the contract job.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov --no-report
          cargo llvm-cov report --json --output-path coverage.json
          cargo llvm-cov report --html
      - name: Publish the browsable report
        # Uploaded even when the floor check fails — a failing run is exactly
        # when someone wants to see which lines are uncovered.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: crate/target/llvm-cov/html/
          if-no-files-found: error
      - name: Enforce the per-module floor on detect/
        run: |
          python3 - <<'PY'
          import json, sys
          FLOOR = 90.0
          files = json.load(open("coverage.json"))["data"][0]["files"]
          under = []
          for f in files:
              if "/detect/" not in f["filename"]:
                  continue
              name = f["filename"].split("/")[-1]
              pct = f["summary"]["lines"]["percent"]
              print(f"{name:20} {pct:6.2f}%")
              if pct < FLOOR:
                  under.append((name, pct))
          if under:
              print(f"\nAGENTS.md sets a {FLOOR}% line coverage floor per module in detect/:")
              for name, pct in under:
                  print(f"  {name}: {pct:.2f}%")
              sys.exit(1)
          PY

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-audit
      - run: cargo audit

  # ---------------------------------------------------------------------
  # The five below exist because something real got through a green suite.
  # Each one names the bug it exists to catch.
  #
  # None of them touches the network — this crate never does. What they
  # reach that the unit tests cannot is a real filesystem, a second
  # operating system, text nobody would type, and a clock.
  # ---------------------------------------------------------------------

  # Inputs a real repository holds and a fixture directory cannot: a
  # byte-order mark, a file that is not UTF-8, a UTF-16 catalogue, a
  # FIFO, a file the caller cannot read, a path over 260 characters, a
  # symlink loop, an empty file, and a minified bundle that is one line.
  # The tree is built at runtime because Windows cannot check half of it
  # into git, and every case the platform cannot express is skipped by
  # name.
  #
  # Found by writing it: a PNG header carries no NUL, so the binary sniff
  # was not what refused one; and the report echoes a file *name*
  # verbatim, which is the one string in the output the report-safety
  # rule does not cover (recorded in AGENTS.md, pinned by the suite).
  hazards:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Hazardous inputs against the built binary
        run: cargo test --locked --test hazards -- --nocapture

  # Behaviour that differs by operating system. envsync-le shipped a
  # release whose report used `\` on Windows and `/` everywhere else, so
  # the whole family now asserts it — and this crate carries a path per
  # file in the report plus one per finding on stderr, which is more
  # surface for that bug than most of the family has. It was present here
  # and `scan::report_path` is the fix.
  #
  # Also: case folding, the Windows device names, CRLF against a lone CR,
  # and stdin closing under the tool's feet.
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Paths, case folding, reserved names, line endings and stdin
        run: cargo test --locked --test platform -- --nocapture
      # Windows ignores TZ entirely, so a suite that quietly depended on
      # it would be red there and nowhere else. Both runs are compared
      # line for line rather than merely required to pass.
      - name: The suite answers the same with TZ set and unset
        shell: bash
        run: |
          set -euo pipefail
          # Names and outcomes, not the summary lines: those carry a
          # duration, and two runs of the same suite never agree on one.
          names() { grep -E '^test ' | grep -v '^test result:' | sort; }
          TZ=UTC cargo test --locked -- --test-threads=1 2>&1 \
            | names > "$RUNNER_TEMP/tz-utc.txt"
          unset TZ
          cargo test --locked -- --test-threads=1 2>&1 \
            | names > "$RUNNER_TEMP/tz-unset.txt"
          test -s "$RUNNER_TEMP/tz-utc.txt"
          diff -u "$RUNNER_TEMP/tz-utc.txt" "$RUNNER_TEMP/tz-unset.txt"

  # The corpus pins documents somebody thought of; this generates the
  # ones nobody did and feeds them to `detect_unicode_risks`, which takes
  # a document and touches no filesystem.
  #
  # Aimed at this crate's own ways of being wrong rather than the usual
  # parser hazards: two indexing schemes over one string (byte offsets in
  # the scanners, UTF-16 code units in the report), grapheme clusters
  # with no bound, words made entirely of combining marks, and bidi
  # controls in the one position that is a special case — the first byte,
  # where U+FEFF is an encoding rather than a finding.
  #
  # Every answer must be well-formed, ordered, on real character
  # boundaries, and ASCII. That last one is the product: a report that
  # quoted what it found would be the delivery mechanism for it.
  fuzz:
    runs-on: ubuntu-24.04
    env:
      UNICODE_LE_FUZZ_SECONDS: '60'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Sixty seconds of hostile text
        run: cargo test --locked --test fuzz -- --test-threads=1 --nocapture

  # A wall-clock ceiling on a corpus generated from a fixed seed, plus
  # two linearity checks: four times the documents, and four times the
  # content in one document.
  #
  # The second is the one that catches a quadratic, and this crate had
  # one. ips-le found the shape first: a UTF-16 column index that
  # re-counts from the line start on every lookup. Invisible on a config
  # file, fatal on a minified bundle — one line holding the whole
  # document, one lookup per finding. 20,000 findings on such a line took
  # 21.8s before the fix and 0.33s after, and the single-line linearity
  # test measures 13.02x against a 6x limit with the fix reverted.
  #
  # The corpus is non-ASCII by construction: an ASCII document needs no
  # code-unit counting at all and takes a path where the bug cannot
  # exist.
  budget:
    runs-on: ubuntu-24.04
    env:
      UNICODE_LE_BUDGET: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: 300 documents inside the budget, and linear in both directions
        run: cargo test --locked --test budget -- --test-threads=1 --nocapture

  # Does the crate open what it claims?
  #
  # Two halves. The **format readers** are the sibling crates' question,
  # asked the same way: every format the tool schema offers must have a
  # real fixture that is read as it and comes back carrying a key path.
  # That one matters more here than it looks, because a lost key path
  # costs no finding by design — which is exactly what would let a reader
  # stop naming anything and still pass every other test in the suite.
  #
  # The **vocabulary** is this crate's own: every `kind`, `severity` and
  # `reason` is a claim that the tool can produce that value, and a value
  # nothing reaches inflates what the tool says it covers and makes a
  # consumer handle a case that never arrives.
  #
  # The marker check is not decoration: `cargo test <filter>` exits 0
  # when the filter matches nothing, so a renamed test would pass this
  # job silently.
  coverage-matrix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Every format reader, kind, severity and refusal reason
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --bins coverage_matrix -- --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/coverage-matrix.txt"
          grep -q 'coverage-matrix: 7 format readers reachable from fixtures' \
            "$RUNNER_TEMP/coverage-matrix.txt"
          grep -q 'coverage-matrix: 7 kinds reachable from fixtures' \
            "$RUNNER_TEMP/coverage-matrix.txt"
          grep -q 'coverage-matrix: 3 severities reachable from fixtures' \
            "$RUNNER_TEMP/coverage-matrix.txt"
          grep -q 'coverage-matrix: 3 refusal reasons reachable from fixtures' \
            "$RUNNER_TEMP/coverage-matrix.txt"

  # A gated tier is a tier that does not run. `versions-le` shipped a
  # scenarios suite that had never been executed once — it asserted a shape
  # the code stopped producing — because nothing ever set its variable.
  scenarios:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: The gated scenario tier
        env:
          UNICODE_LE_SCENARIOS: "1"
        run: cargo test --test scenarios -- --test-threads=1
