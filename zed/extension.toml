id = "unicode-le"
name = "Unicode-LE"
description = "Find the Unicode that hides meaning: bidi controls, invisibles, homoglyphs and mixed scripts."
version = "1.0.1"
schema_version = 1
authors = ["nolindnaidoo"]
repository = "https://github.com/nolindnaidoo/unicode-le"

# Zed's extension API offers languages, debuggers, themes, snippets, slash
# commands and context servers — it has no way to read the active buffer or
# register a command, which is what the VS Code extension is built on. A
# context server is the surface that fits: the same engine, reached from the
# agent panel instead of the command palette.
[context_servers.unicode-le]
